<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pondo — Public report</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f7fc;color:#222039;font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:20px}h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}.subtitle,.status{font-size:12px;color:#625f74}.status{min-height:1.5em}.cards{display:grid;gap:12px}.card{background:white;border:1px solid #e3dfef;border-radius:14px;padding:16px;min-width:0}.metrics{display:flex;gap:16px;flex-wrap:wrap}.metric{flex:1;min-width:100px}.metric span{display:block;font-size:12px;color:#625f74}.metric strong{font-size:16px;overflow-wrap:anywhere}.table-wrap{overflow-x:auto;margin-top:12px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:8px;border-top:1px solid #eeeaf4;white-space:nowrap}th:last-child,td:last-child{text-align:right}.empty{color:#625f74}.brand{font-weight:700;color:#7253ad;font-size:12px;margin-top:20px}@media(max-width:400px){main{padding:12px}.card{padding:12px}}
</style>
</head>
<body>
<main>
  <h1>Pondo public report</h1>
  <p class="subtitle">Read-only · Only information selected for public sharing is shown.</p>
  <p id="status" class="status" role="status" aria-live="polite">Loading report…</p>
  <div id="report" class="cards"></div>
  <p class="brand">Powered by Pondo</p>
</main>
<script type="module" src="./viewer.js"></script>
</body>
</html>
