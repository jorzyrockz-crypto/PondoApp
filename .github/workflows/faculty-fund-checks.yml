name: Faculty Fund and app checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: faculty-fund-functions/package-lock.json
      - name: Install isolated Faculty Fund backend dependencies
        run: npm ci --prefix faculty-fund-functions --ignore-scripts --no-audit --no-fund
      - name: Verify callable codebase loads
        run: GCLOUD_PROJECT=demo-pondo-security node -e "const f=require('./faculty-fund-functions'); if(Object.keys(f).length!==4) process.exit(1)"
      - name: Run app and Faculty Fund unit tests
        run: node --test tests/*.test.cjs
      - name: Install browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/faculty-browser" playwright-core --no-audit --no-fund
      - name: Run synthetic Faculty Fund browser workflow
        run: |
          set +e
          (
            set -e
            export NODE_PATH="$RUNNER_TEMP/faculty-browser/node_modules"
            export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
            test -n "$CHROMIUM_PATH"
            node tests/faculty-fund-ui.browser.cjs
            node tests/faculty-spark-recovery.browser.cjs
            node tests/death-aid-modal.browser.cjs
            node tests/refund-suggestions.browser.cjs
            node tests/refund-funding.browser.cjs
            node tests/refund-uncommitted.browser.cjs
            node tests/transactions-layout.browser.cjs
            node tests/sample-data.browser.cjs
            node tests/offline-sync.browser.cjs
            node tests/offline-guest-workflow.browser.cjs
            node tests/team-draft-reconcile.browser.cjs
            node tests/team-recovery-notice.browser.cjs
            node tests/refund-impact.browser.cjs
            node tests/member-refund.browser.cjs
            node tests/my-refunds.browser.cjs
            node tests/refund-transparency.browser.cjs
            node tests/notification-mobile.browser.cjs
          ) > "$RUNNER_TEMP/browser-test.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/browser-test.log"
          if [ "$result" -ne 0 ]; then
            python -c 'import os,pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"],"browser-test.log").read_text(errors="replace")[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
