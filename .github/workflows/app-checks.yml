name: App checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run app unit tests
        run: node --test tests/*.test.cjs
      - name: Install browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/app-browser" playwright-core --no-audit --no-fund
      - name: Run app browser workflows
        run: |
          set +e
          (
            set -e
            export NODE_PATH="$RUNNER_TEMP/app-browser/node_modules"
            export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
            test -n "$CHROMIUM_PATH"
            node tests/death-aid-modal.browser.cjs
            node tests/cash-donation-workflow.browser.cjs
            node tests/refund-suggestions.browser.cjs
            node tests/refund-item-layout.browser.cjs
            node tests/refund-funding.browser.cjs
            node tests/refund-uncommitted.browser.cjs
            node tests/transactions-layout.browser.cjs
            node tests/sample-data.browser.cjs
            node tests/offline-sync.browser.cjs
            node tests/offline-guest-workflow.browser.cjs
            node tests/shell-version.browser.cjs
            node tests/team-reference.browser.cjs
            node tests/team-compact.browser.cjs
            node tests/workspace-switcher.browser.cjs
            node tests/team-draft-reconcile.browser.cjs
            node tests/team-recovery-notice.browser.cjs
            node tests/refund-impact.browser.cjs
            node tests/member-refund.browser.cjs
            node tests/my-refunds.browser.cjs
            node tests/refund-transparency.browser.cjs
            node tests/notification-mobile.browser.cjs
            node tests/tablet-dashboard-permission.browser.cjs
            node tests/dashboard-quick-actions.browser.cjs
            node tests/other-funds.browser.cjs
            node tests/other-handover.browser.cjs
            node tests/presentation-content.browser.cjs
            node tests/fund-transaction.browser.cjs
            node tests/fund-tabs.browser.cjs
            node tests/fund-settings.browser.cjs
            node tests/income-edit.browser.cjs
          ) > "$RUNNER_TEMP/browser-test.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/browser-test.log"
          if [ "$result" -ne 0 ]; then
            python -c 'import os,pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"],"browser-test.log").read_text(errors="replace")[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
