name: Firestore security emulator
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: emulator-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test dependencies
        run: npm ci --prefix emulator-tests --ignore-scripts --no-audit --no-fund
      - name: Run demo-project Firestore rules and migration tests
        run: |
          set +e
          npm --prefix emulator-tests run test:firestore > "$RUNNER_TEMP/emulator-test.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/emulator-test.log"
          if [ "$result" -ne 0 ]; then
            python -c 'import os,pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"],"emulator-test.log").read_text(errors="replace")[-12000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
